services:
  db:
    image: postgres:16
    container_name: COVERAGEX_DB
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todo"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    container_name: COVERAGEX_API
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/todo
      DB_USER: postgres
      DB_PASSWORD: postgres
      APP_PORT: 8000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    container_name: COVERAGEX_WEB
    build:
      context: ../COVERAGEX-FRONTEND
      dockerfile: Dockerfile
    environment:
      - VITE_API_BASE_URL=http://api:8000/api/tasks
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pgdata:
