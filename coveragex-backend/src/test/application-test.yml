spring:
  datasource:
    url: jdbc:h2:mem:todo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false

# ensures test profile isolation
server:
  port: 0

logging:
  level:
    root: WARN
    org.springframework.test: INFO
    com.coveragex.todo: DEBUG
